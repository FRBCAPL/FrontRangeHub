<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Front Range Pool League.com</title>
    <meta name="description" content="A modern chat and scheduling app built with React and Vite." />
    <script>
      (function () {
        var host = (window.location.hostname || '').toLowerCase();
        if (host === 'fiduciarylog.com' || host === 'www.fiduciarylog.com') {
          document.title = 'Estate Vault — Estate Inventory for Personal Representatives';
          var desc = document.querySelector('meta[name="description"]');
          if (desc) {
            desc.setAttribute(
              'content',
              'Estate Vault helps personal representatives record property, money, and distributions. Court-supporting estate records — not legal advice.'
            );
          }
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute('href', '/estate-vault/ev-app-icon.png');
          function ensureMeta(attr, key, value) {
            var el = document.querySelector('meta[' + attr + '="' + key + '"]');
            if (!el) {
              el = document.createElement('meta');
              el.setAttribute(attr, key);
              document.head.appendChild(el);
            }
            el.setAttribute('content', value);
          }
          ensureMeta('property', 'og:title', 'Estate Vault — Estate Inventory for Personal Representatives');
          ensureMeta('property', 'og:description', 'Record property, money, and distributions. Organize the estate record and export court-supporting reports.');
          ensureMeta('property', 'og:image', 'https://fiduciarylog.com/estate-vault/ev-main-logo.png');
          ensureMeta('property', 'og:url', 'https://fiduciarylog.com/estate-vault/');
          ensureMeta('property', 'og:type', 'website');
          ensureMeta('name', 'twitter:card', 'summary_large_image');
        }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function () {
        var path = window.location.pathname || '';
        var match = path.match(/^\/(arcade-kiosk-lite|dues-tracker)\/?$/);
        if (match) {
          window.location.replace('/' + match[1] + '/index.html' + window.location.search + window.location.hash);
          return;
        }
        // Estate Vault custom domain — marketing storefront first; app stays at /#/estateit
        var host = (window.location.hostname || '').toLowerCase();
        if (host === 'fiduciarylog.com' || host === 'www.fiduciarylog.com') {
          var path = window.location.pathname || '/';
          var hash = window.location.hash || '';
          if (path.indexOf('/estate-vault') === 0) return;
          if (hash.startsWith('#/estateit') || hash.startsWith('#/estate-inventory')) return;
          if (path === '/' || path === '') {
            window.location.replace(
              window.location.origin + '/estate-vault/' + (window.location.search || '')
            );
            return;
          }
          window.location.replace(
            window.location.origin + '/#/estateit' + (window.location.search || '')
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
